buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 29
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.2.12479018"
        ndkPath = "C:/Program Files/Unity/Hub/Editor/6000.6.0f1/Editor/Data/PlaybackEngines/AndroidPlayer/NDK"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        flatDir {
            dirs "${project(':unityLibrary').projectDir}/libs"
        }
    }
}

// El SDK de Android usado aqui es el que trae Unity (bajo Program Files, de solo
// lectura) y solo tiene instalado build-tools 36.0.0. Algunos modulos nativos
// autolinkeados (ej. azesmway_react-native-unity) no fijan su propio
// buildToolsVersion y AGP intenta autoinstalar otra version (35.0.0) por
// default, lo cual falla porque el SDK no se puede escribir. Se fuerza aqui
// la misma version en todos los subprojects Android para evitar esa auto-descarga.
subprojects { subproject ->
    subproject.plugins.withId('com.android.library') {
        subproject.extensions.findByName('android')?.buildToolsVersion = rootProject.ext.buildToolsVersion
    }
    subproject.plugins.withId('com.android.application') {
        subproject.extensions.findByName('android')?.buildToolsVersion = rootProject.ext.buildToolsVersion
    }
}
