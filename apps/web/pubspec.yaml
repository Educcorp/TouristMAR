name: touristmar_web
description: Panel web de TouristMAR (Flutter Web)
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Rutas con URL limpia en la web (`/admin/mapa` en vez de `/#/admin/mapa`).
  flutter_web_plugins:
    sdk: flutter
  http: ^1.2.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  file_picker: ^8.1.4
  http_parser: ^4.0.2
  fl_chart: ^0.69.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  # APIs del navegador para la build web (reemplaza a dart:html, obsoleto).
  web: ^1.1.0
  panorama_viewer: ^2.0.7
  url_launcher: ^6.3.3
  go_router: ^18.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/hero-manzanillo.jpg
    - assets/images/place-playa-audiencia.jpg
    - assets/images/place-cerro-vigia.jpg
    - assets/images/place-laguna-cuyutlan.jpg
    - assets/images/admin-hero-bahia.webp
    - assets/images/logo_light.png
    - assets/images/logo_dark.png
    - assets/icons/google_logo.svg
